<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #2c3e50;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px; /* Mobile aspect ratio constraint */
            background: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 10;
            transition: opacity 0.3s ease;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Typography */
        h1 {
            font-family: 'Fredoka One', cursive;
            color: #FFD700;
            font-size: 3rem;
            text-shadow: 4px 4px 0 #d35400, 6px 6px 0 #2c3e50;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            animation: float 3s ease-in-out infinite;
        }

        h2 {
            font-family: 'Fredoka One', cursive;
            color: #fff;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0 #333;
        }

        p {
            color: #ecf0f1;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        /* Forms */
        .input-group {
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 300px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: 2px solid #FFD700;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            outline: none;
            transition: transform 0.2s;
        }

        input:focus {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        /* Buttons */
        .btn {
            background: linear-gradient(to bottom, #f1c40f, #f39c12);
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            color: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
            box-shadow: 0 5px 0 #d35400, 0 10px 10px rgba(0,0,0,0.2);
            transition: all 0.1s;
            margin: 10px;
            min-width: 200px;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #d35400, 0 0px 0 rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: linear-gradient(to bottom, #3498db, #2980b9);
            box-shadow: 0 5px 0 #1c5980, 0 10px 10px rgba(0,0,0,0.2);
            font-size: 1.2rem;
            padding: 12px 30px;
        }

        .btn-secondary:active {
            box-shadow: 0 0 0 #1c5980;
        }

        .btn-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e74c3c;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        .score-container {
            font-family: 'Fredoka One', cursive;
            color: white;
            text-shadow: 2px 2px 0 #000;
            font-size: 2rem;
        }

        .coin-display {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            color: #FFD700;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
        }

        .coin-icon {
            width: 20px;
            height: 20px;
            background: #FFD700;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid #f39c12;
            box-shadow: inset -2px -2px 0 #f39c12;
            display: inline-block;
        }

        /* Shop Grid */
        .shop-container {
            width: 100%;
            height: 70%;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .shop-item.active {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
        }

        .shop-item:hover {
            transform: scale(1.02);
        }

        .item-preview {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            position: relative;
        }

        .item-name {
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .item-cost {
            color: #FFD700;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .locked-overlay {
            opacity: 0.5;
            filter: grayscale(1);
        }

        /* Upgrade Section in Shop */
        .upgrade-section {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }

        .upgrade-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: white;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div class="hud" id="game-hud" style="display: none;">
            <div class="score-container" id="current-score">0</div>
            <div class="coin-display">
                <div class="coin-icon"></div>
                <span id="current-coins">0</span>
            </div>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="ui-screen">
            <h1>Flappy Adventure</h1>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Masukkan Username" maxlength="10">
            </div>
            <button class="btn" onclick="Game.login()">MAIN</button>
            <p style="font-size: 0.8rem; margin-top: 20px; opacity: 0.7;">Progress akan tersimpan otomatis</p>
        </div>

        <!-- Main Menu -->
        <div id="menu-screen" class="ui-screen hidden">
            <h1>Flappy Adventure</h1>
            <p>Welcome, <span id="player-name" style="color:#FFD700; font-weight:bold;">Player</span></p>
            <div class="coin-display" style="margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 10px 20px;">
                <div class="coin-icon"></div>
                <span id="menu-coins">0</span>
            </div>
            <button class="btn" onclick="Game.start()">START GAME</button>
            <button class="btn btn-secondary" onclick="UI.showShop()">TOKO & UPGRADE</button>
            <button class="btn btn-secondary" style="background: #e74c3c; box-shadow: 0 5px 0 #c0392b;" onclick="Game.logout()">LOGOUT</button>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen" class="ui-screen hidden">
            <div class="btn-close" onclick="UI.showMenu()">✕</div>
            <h2>Toko Karakter</h2>
            <div class="coin-display" style="margin-bottom: 10px;">
                <div class="coin-icon"></div>
                <span id="shop-coins">0</span>
            </div>
            
            <div class="shop-container" id="character-list">
                <!-- Filled by JS -->
            </div>

            <div class="upgrade-section">
                <h2>Skill Upgrade</h2>
                <div class="upgrade-row">
                    <span>Magnet Koin (Lv. <span id="magnet-level">0</span>)</span>
                    <button class="btn-secondary" style="font-size: 0.8rem; padding: 5px 10px;" onclick="Shop.upgradeSkill('magnet')">
                        Upgrade (<span id="magnet-cost">100</span>)
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="ui-screen hidden">
            <h1 style="color: #e74c3c; text-shadow: 4px 4px 0 #fff;">GAME OVER</h1>
            <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; margin-bottom: 20px; width: 80%;">
                <p>Score: <span id="final-score" style="color: white; font-weight: bold; font-size: 1.5rem;">0</span></p>
                <p>High Score: <span id="best-score" style="color: #FFD700;">0</span></p>
                <p>Coins: +<span id="collected-coins" style="color: #FFD700;">0</span></p>
            </div>
            <button class="btn" onclick="Game.restart()">COBA LAGI</button>
            <button class="btn btn-secondary" onclick="UI.showMenu()">MENU</button>
        </div>
    </div>

    <script>
        // --- Game Configuration & Data ---
        const CHARACTERS = {
            bird: { name: "Bird", price: 0, color: "#FFD700", type: "bird" },
            blue: { name: "Blue Bird", price: 100, color: "#3498db", type: "bird" },
            red: { name: "Red Bird", price: 200, color: "#e74c3c", type: "bird" },
            green: { name: "Green Bird", price: 300, color: "#2ecc71", type: "bird" },
            dragon: { name: "Dragon", price: 1000, color: "#8e44ad", type: "dragon" },
            phoenix: { name: "Phoenix", price: 2000, color: "#e67e22", type: "dragon" }
        };

        const SKILLS = {
            magnet: { baseCost: 100, maxLevel: 5 }
        };

        const User = {
            username: null,
            data: null,

            login(username) {
                if (!username) return alert("Masukkan username!");
                this.username = username;
                const saved = localStorage.getItem(`fb_game_${username}`);
                if (saved) {
                    this.data = JSON.parse(saved);
                    // Migration for old data structure if needed
                    if (!this.data.skills) this.data.skills = { magnet: 0 };
                } else {
                    this.data = {
                        coins: 0,
                        highScore: 0,
                        unlocked: ['bird'],
                        selected: 'bird',
                        skills: { magnet: 0 }
                    };
                }
                this.save();
                return true;
            },

            save() {
                if (this.username) {
                    localStorage.setItem(`fb_game_${this.username}`, JSON.stringify(this.data));
                }
            },

            addCoins(amount) {
                this.data.coins += amount;
                this.save();
                UI.updateCoins();
            },

            buyCharacter(id) {
                const char = CHARACTERS[id];
                if (this.data.coins >= char.price) {
                    this.data.coins -= char.price;
                    this.data.unlocked.push(id);
                    this.selectCharacter(id);
                    this.save();
                    return true;
                }
                return false;
            },

            selectCharacter(id) {
                if (this.data.unlocked.includes(id)) {
                    this.data.selected = id;
                    this.save();
                    return true;
                }
                return false;
            },

            upgradeSkill(skillName) {
                const skill = SKILLS[skillName];
                const currentLevel = this.data.skills[skillName] || 0;

                if (currentLevel >= skill.maxLevel) return false;

                const cost = skill.baseCost * (currentLevel + 1);

                if (this.data.coins >= cost) {
                    this.data.coins -= cost;
                    this.data.skills[skillName] = currentLevel + 1;
                    this.save();
                    return true;
                }
                return false;
            }
        };

        // --- UI Manager ---
        const UI = {
            screens: ['login-screen', 'menu-screen', 'shop-screen', 'game-over-screen'],
            
            show(screenId) {
                this.screens.forEach(id => document.getElementById(id).classList.add('hidden'));
                const el = document.getElementById(screenId);
                if(el) el.classList.remove('hidden');
            },

            showMenu() {
                this.show('menu-screen');
                document.getElementById('player-name').textContent = User.username;
                document.getElementById('game-hud').style.display = 'none';
                this.updateCoins();
            },

            showShop() {
                this.show('shop-screen');
                this.renderShop();
            },

            updateCoins() {
                const coins = User.data.coins;
                document.getElementById('menu-coins').textContent = coins;
                document.getElementById('shop-coins').textContent = coins;
                document.getElementById('current-coins').textContent = coins;
            },

            renderShop() {
                const list = document.getElementById('character-list');
                list.innerHTML = '';

                Object.keys(CHARACTERS).forEach(key => {
                    const char = CHARACTERS[key];
                    const isUnlocked = User.data.unlocked.includes(key);
                    const isSelected = User.data.selected === key;

                    const el = document.createElement('div');
                    el.className = `shop-item ${isSelected ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
                    el.onclick = () => Shop.handleItemClick(key);

                    // Draw mini canvas for preview
                    const cvs = document.createElement('canvas');
                    cvs.width = 50; cvs.height = 50;
                    cvs.className = 'item-preview';
                    const ctx = cvs.getContext('2d');
                    // Simple preview drawing
                    ctx.translate(25, 25);
                    ctx.fillStyle = char.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI*2);
                    ctx.fill();

                    if (!isUnlocked) {
                        el.classList.add('locked-overlay');
                    }

                    el.innerHTML = `
                        ${cvs.outerHTML}
                        <div class="item-name">${char.name}</div>
                        <div class="item-cost">${isUnlocked ? (isSelected ? 'EQUIPPED' : 'OWNED') : `🪙 ${char.price}`}</div>
                    `;

                    list.appendChild(el);
                });

                // Update Upgrade UI
                const magLvl = User.data.skills.magnet;
                document.getElementById('magnet-level').textContent = magLvl >= SKILLS.magnet.maxLevel ? "MAX" : magLvl;
                const nextCost = SKILLS.magnet.baseCost * (magLvl + 1);
                const btn = document.getElementById('magnet-cost').parentElement;
                btn.style.display = magLvl >= SKILLS.magnet.maxLevel ? "none" : "inline-block";
                document.getElementById('magnet-cost').textContent = nextCost;
            }
        };

        // --- Shop Logic ---
        const Shop = {
            handleItemClick(id) {
                if (User.data.unlocked.includes(id)) {
                    User.selectCharacter(id);
                } else {
                    if (confirm(`Buy ${CHARACTERS[id].name} for ${CHARACTERS[id].price} coins?`)) {
                        if (!User.buyCharacter(id)) {
                            alert("Not enough coins!");
                        }
                    }
                }
                UI.renderShop();
            },

            upgradeSkill(skill) {
                if (!User.upgradeSkill(skill)) {
                    alert("Not enough coins or Max Level!");
                }
                UI.renderShop();
                UI.updateCoins();
            }
        };

        // --- Game Engine ---
        const Canvas = document.getElementById('gameCanvas');
        const Ctx = Canvas.getContext('2d');

        // Handle High DPI
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const dpr = window.devicePixelRatio || 1;
            // Set display size (css pixels)
            const width = container.clientWidth;
            const height = container.clientHeight;

            Canvas.style.width = width + "px";
            Canvas.style.height = height + "px";

            // Set actual size in memory (scaled to account for extra pixel density)
            Canvas.width = width * dpr;
            Canvas.height = height * dpr;

            // Normalize coordinate system to use css pixels
            Ctx.scale(dpr, dpr);

            return { width, height };
        }

        const Game = {
            state: 'start', // start, playing, gameover
            width: 0,
            height: 0,
            frame: 0,
            score: 0,
            coinsCollected: 0,
            entities: [],

            // Game Loop
            loopId: null,

            login() {
                const username = document.getElementById('username-input').value.trim();
                if (User.login(username)) {
                    UI.showMenu();
                }
            },

            logout() {
                User.username = null;
                UI.show('login-screen');
                document.getElementById('username-input').value = '';
            },

            start() {
                UI.show('none'); // Hide all menus
                document.getElementById('game-hud').style.display = 'flex';
                this.resize();
                this.reset();
                this.state = 'playing';
                this.loop();
            },

            restart() {
                this.start();
            },

            resize() {
                const dim = resizeCanvas();
                this.width = dim.width;
                this.height = dim.height;
            },

            reset() {
                this.score = 0;
                this.coinsCollected = 0;
                this.frame = 0;
                document.getElementById('current-score').textContent = 0;
                document.getElementById('current-coins').textContent = User.data.coins;

                // Initialize Entities
                this.player = new Player(this.width / 3, this.height / 2);
                this.pipes = [];
                this.coins = [];
                this.bgOffset = 0;
            },

            loop() {
                if (this.state !== 'playing') return;
                
                this.update();
                this.draw();

                this.loopId = requestAnimationFrame(() => this.loop());
            },

            stop() {
                cancelAnimationFrame(this.loopId);
            },

            gameOver() {
                this.state = 'gameover';

                // Save score
                if (this.score > User.data.highScore) {
                    User.data.highScore = this.score;
                }
                User.addCoins(this.coinsCollected); // Coins are permanently added

                // Update UI
                document.getElementById('final-score').textContent = this.score;
                document.getElementById('best-score').textContent = User.data.highScore;
                document.getElementById('collected-coins').textContent = this.coinsCollected;

                UI.show('game-over-screen');
            },

            update() {
                this.frame++;
                this.player.update();

                // Spawn Pipes
                if (this.frame % 120 === 0) {
                    this.pipes.push(new Pipe(this.width));

                    // 50% chance to spawn coin in pipe
                    if (Math.random() > 0.3) {
                         const pipe = this.pipes[this.pipes.length-1];
                         this.coins.push(new Coin(pipe.x + pipe.w/2, pipe.gapY + pipe.gap/2));
                    }
                }

                // Update Pipes
                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    const pipe = this.pipes[i];
                    pipe.update();

                    if (pipe.offScreen()) {
                        this.pipes.splice(i, 1);
                    }

                    // Collision
                    if (pipe.collides(this.player)) {
                        this.gameOver();
                    }

                    // Score
                    if (!pipe.passed && pipe.x + pipe.w < this.player.x) {
                        pipe.passed = true;
                        this.score++;
                        document.getElementById('current-score').textContent = this.score;
                    }
                }

                // Update Coins
                const magnetRadius = User.data.skills.magnet * 50; // 50px per level

                for (let i = this.coins.length - 1; i >= 0; i--) {
                    const coin = this.coins[i];
                    coin.update();

                    // Magnet Effect
                    if (magnetRadius > 0) {
                        const dx = this.player.x - coin.x;
                        const dy = this.player.y - coin.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < magnetRadius + 100) {
                            coin.x += dx * 0.1;
                            coin.y += dy * 0.1;
                        }
                    }

                    // Collision
                    if (coin.collides(this.player)) {
                        this.coinsCollected++;
                        // Immediate visual update, but saved at end
                        document.getElementById('current-coins').textContent = User.data.coins + this.coinsCollected;
                        this.coins.splice(i, 1);
                    } else if (coin.offScreen()) {
                        this.coins.splice(i, 1);
                    }
                }

                // Floor Collision
                if (this.player.y + this.player.radius >= this.height) {
                    this.gameOver();
                }
            },

            draw() {
                // Background
                const bgGradient = Ctx.createLinearGradient(0, 0, 0, this.height);
                bgGradient.addColorStop(0, '#87CEEB');
                bgGradient.addColorStop(1, '#E0F7FA');
                Ctx.fillStyle = bgGradient;
                Ctx.fillRect(0, 0, this.width, this.height);

                // Draw Clouds (Simple)
                Ctx.fillStyle = 'rgba(255,255,255,0.6)';
                Ctx.beginPath();
                Ctx.arc(100 - (this.frame * 0.5) % (this.width + 200), 100, 30, 0, Math.PI * 2);
                Ctx.fill();

                this.pipes.forEach(p => p.draw());
                this.coins.forEach(c => c.draw());
                this.player.draw();
            }
        };

        // --- Entities ---
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.velocity = 0;
                this.gravity = 0.22;
                this.jump = -4.5;
                this.radius = 12;

                // Load Character Stats
                const charType = CHARACTERS[User.data.selected].type;
                if (charType === 'dragon') {
                    this.gravity = 0.18; // lighter
                    this.radius = 15;
                }
            }
            
            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;
            }

            draw() {
                Ctx.save();
                Ctx.translate(this.x, this.y);
                const rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                Ctx.rotate(rot);
                
                const charData = CHARACTERS[User.data.selected];

                // Body
                Ctx.fillStyle = charData.color;
                Ctx.beginPath();
                Ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                Ctx.fill();

                // Eye
                Ctx.fillStyle = 'white';
                Ctx.beginPath();
                Ctx.arc(6, -6, 5, 0, Math.PI * 2);
                Ctx.fill();
                Ctx.fillStyle = 'black';
                Ctx.beginPath();
                Ctx.arc(8, -6, 2, 0, Math.PI * 2);
                Ctx.fill();

                // Wing
                Ctx.fillStyle = 'rgba(0,0,0,0.2)';
                Ctx.beginPath();
                Ctx.ellipse(-5, 5, 8, 5, 0, 0, Math.PI*2);
                Ctx.fill();

                Ctx.restore();
            }

            flap() {
                this.velocity = this.jump;
            }
        }

        class Pipe {
            constructor(canvasWidth) {
                this.x = canvasWidth;
                this.w = 60;
                this.gap = 190;
                this.speed = 3;
                this.passed = false;

                // Random position
                const minH = 50;
                const maxH = Game.height - minH - this.gap;
                this.gapY = Math.floor(Math.random() * (maxH - minH + 1) + minH);
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                Ctx.fillStyle = '#2ecc71';
                Ctx.strokeStyle = '#27ae60';
                Ctx.lineWidth = 3;

                // Top Pipe
                Ctx.fillRect(this.x, 0, this.w, this.gapY);
                Ctx.strokeRect(this.x, 0, this.w, this.gapY);

                // Bottom Pipe
                const bottomY = this.gapY + this.gap;
                const bottomH = Game.height - bottomY;
                Ctx.fillRect(this.x, bottomY, this.w, bottomH);
                Ctx.strokeRect(this.x, bottomY, this.w, bottomH);

                // Caps
                Ctx.fillStyle = '#27ae60';
                Ctx.fillRect(this.x - 5, this.gapY - 20, this.w + 10, 20);
                Ctx.fillRect(this.x - 5, bottomY, this.w + 10, 20);
            }

            offScreen() {
                return this.x + this.w < 0;
            }

            collides(player) {
                // Simple box collision
                // Top box
                if (player.x + player.radius > this.x && player.x - player.radius < this.x + this.w) {
                    if (player.y - player.radius < this.gapY || player.y + player.radius > this.gapY + this.gap) {
                        return true;
                    }
                }
                return false;
            }
        }

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.wobble = Math.random() * Math.PI * 2;
            }

            update() {
                this.x -= 3; // Move with pipes
                this.wobble += 0.1;
                this.y += Math.sin(this.wobble) * 0.5;
            }

            draw() {
                Ctx.save();
                Ctx.translate(this.x, this.y);
                Ctx.scale(Math.sin(this.wobble), 1); // Spinning effect

                Ctx.fillStyle = '#FFD700';
                Ctx.beginPath();
                Ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                Ctx.fill();

                Ctx.strokeStyle = '#f39c12';
                Ctx.lineWidth = 2;
                Ctx.stroke();

                Ctx.fillStyle = '#f39c12';
                Ctx.font = '12px Arial';
                Ctx.textAlign = 'center';
                Ctx.textBaseline = 'middle';
                Ctx.fillText('$', 0, 1);

                Ctx.restore();
            }

            offScreen() {
                return this.x + 20 < 0;
            }

            collides(player) {
                const dx = this.x - player.x;
                const dy = this.y - player.y;
                return Math.sqrt(dx*dx + dy*dy) < (this.radius + player.radius);
            }
        }

        // --- Controls ---
        window.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                if (Game.state === 'playing') Game.player.flap();
            }
        });

        window.addEventListener('mousedown', () => {
             if (Game.state === 'playing') Game.player.flap();
        });

        window.addEventListener('touchstart', (e) => {
             //e.preventDefault(); // handled by css touch-action
             if (Game.state === 'playing') Game.player.flap();
        });

        window.addEventListener('resize', () => {
            Game.resize();
        });

        // Init
        window.onload = () => {
            Game.resize();
        };

    </script>
</body>
