<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #2c3e50;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px; /* Mobile aspect ratio constraint */
            background: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays - Elegant Redesign */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.95), rgba(44, 62, 80, 0.95));
            z-index: 10;
            transition: opacity 0.4s ease;
            padding: 30px;
            padding-bottom: env(safe-area-inset-bottom, 30px);
            text-align: center;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Splash Screen */
        #splash-screen {
            background: #2c3e50;
            z-index: 20;
        }

        .logo-anim {
            font-size: 4rem;
            animation: pulse-glow 2s infinite;
        }

        /* Typography */
        h1 {
            font-family: 'Fredoka One', cursive;
            color: #FFD700;
            font-size: 3rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5); /* Softer shadow */
            margin-bottom: 2rem;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); /* Glow effect */
            animation: float 3s ease-in-out infinite;
        }

        h2 {
            font-family: 'Fredoka One', cursive;
            color: #fff;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0 #333;
        }

        p {
            color: #ecf0f1;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        /* Forms */
        .input-group {
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 300px;
        }

        /* Elegant Input Fields */
        input {
            width: 100%;
            padding: 15px 5px;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            font-size: 1.2rem;
            text-align: center;
            font-family: 'Roboto', sans-serif; /* Cleaner font for inputs */
            color: #fff;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Fredoka One', cursive;
        }

        input:focus {
            border-bottom: 2px solid #FFD700;
            background: linear-gradient(to top, rgba(255, 215, 0, 0.1), transparent);
        }

        /* Elegant Buttons */
        .btn {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border: none;
            border-radius: 12px; /* Less rounded, more modern */
            padding: 18px 40px;
            color: #1a1a1a;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 15px 0;
            width: 100%;
            max-width: 300px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 165, 0, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(255, 165, 0, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(to bottom, #3498db, #2980b9);
            box-shadow: 0 5px 0 #1c5980, 0 10px 10px rgba(0,0,0,0.2);
            font-size: 1.2rem;
            padding: 12px 30px;
        }

        .btn-secondary:active {
            box-shadow: 0 0 0 #1c5980;
        }

        .btn-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e74c3c;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        .score-container {
            font-family: 'Fredoka One', cursive;
            color: white;
            text-shadow: 2px 2px 0 #000;
            font-size: 2rem;
        }

        .coin-display {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            color: #FFD700;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
        }

        .coin-icon {
            width: 20px;
            height: 20px;
            background: #FFD700;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid #f39c12;
            box-shadow: inset -2px -2px 0 #f39c12;
            display: inline-block;
        }

        /* Shop Grid */
        .shop-container {
            width: 100%;
            flex: 1; /* Take remaining space */
            min-height: 0; /* Allow shrinking for scroll */
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 10px;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .shop-item.active {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
        }

        .shop-item:hover {
            transform: scale(1.02);
        }

        .item-preview {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            position: relative;
        }

        .item-name {
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .item-cost {
            color: #FFD700;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .locked-overlay {
            opacity: 0.5;
            filter: grayscale(1);
        }

        /* Upgrade Section in Shop */
        .upgrade-section {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            flex-shrink: 0; /* Prevent shrinking */
            margin-bottom: 80px; /* Large safe area for android nav bars */
        }

        .upgrade-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: white;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); text-shadow: 0 0 10px #FFD700; }
            50% { transform: scale(1.1); text-shadow: 0 0 30px #FFD700; }
            100% { transform: scale(1); text-shadow: 0 0 10px #FFD700; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div class="hud" id="game-hud" style="display: none;">
            <div class="score-container" id="current-score">0</div>
            <div class="coin-display">
                <div class="coin-icon"></div>
                <span id="current-coins">0</span>
            </div>
        </div>

        <!-- Splash Screen -->
        <div id="splash-screen" class="ui-screen">
            <h1 class="logo-anim">Flappy<br>Adventure</h1>
            <p>Loading...</p>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="ui-screen hidden">
            <h1>Flappy Adventure</h1>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Username" maxlength="10">
            </div>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="Password" maxlength="10">
            </div>
            <button class="btn" onclick="Game.login()">MAIN / DAFTAR</button>
            <p style="font-size: 0.8rem; margin-top: 20px; opacity: 0.7;">Akun baru akan dibuat otomatis jika belum ada.<br>Jangan lupa password anda!</p>
        </div>

        <!-- Main Menu -->
        <div id="menu-screen" class="ui-screen hidden">
            <h1>Flappy Adventure</h1>
            <p>Welcome, <span id="player-name" style="color:#FFD700; font-weight:bold;">Player</span></p>
            <div class="coin-display" style="margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 10px 20px;">
                <div class="coin-icon"></div>
                <span id="menu-coins">0</span>
            </div>
            <button class="btn" onclick="Game.start()">START GAME</button>
            <button class="btn btn-secondary" onclick="UI.showShop()">TOKO & UPGRADE</button>
            <button class="btn btn-secondary" style="background: #e74c3c; box-shadow: 0 5px 0 #c0392b;" onclick="Game.logout()">LOGOUT</button>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen" class="ui-screen hidden">
            <div class="btn-close" onclick="UI.showMenu()">✕</div>
            <h2>Toko Karakter</h2>
            <div class="coin-display" style="margin-bottom: 10px;">
                <div class="coin-icon"></div>
                <span id="shop-coins">0</span>
            </div>
            
            <div class="shop-container" id="character-list">
                <!-- Filled by JS -->
            </div>

            <div class="upgrade-section">
                <h2>Skill Upgrade</h2>
                <div class="upgrade-row">
                    <span>Magnet Koin (Lv. <span id="magnet-level">0</span>)</span>
                    <button class="btn-secondary" style="font-size: 0.8rem; padding: 5px 10px;" onclick="Shop.upgradeSkill('magnet')">
                        Upgrade (<span id="magnet-cost">100</span>)
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="ui-screen hidden">
            <h1 style="color: #e74c3c; text-shadow: 4px 4px 0 #fff;">GAME OVER</h1>
            <div id="medal-display" class="hidden" style="margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <!-- Medal injected here -->
            </div>
            <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; margin-bottom: 20px; width: 80%;">
                <p>Score: <span id="final-score" style="color: white; font-weight: bold; font-size: 1.5rem;">0</span></p>
                <p>High Score: <span id="best-score" style="color: #FFD700;">0</span></p>
                <p>Coins: +<span id="collected-coins" style="color: #FFD700;">0</span></p>
            </div>
            <button class="btn" onclick="Game.restart()">COBA LAGI</button>
            <button class="btn btn-secondary" onclick="UI.showMenu()">MENU</button>
        </div>
    </div>

    <script>
        // --- Audio System ---
        const AudioController = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            play(type) {
                if (!User.settings.sound || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                const now = this.ctx.currentTime;

                if (type === 'flap') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'coin') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.setValueAtTime(1600, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            }
        };

        // --- Effects & Particles ---
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'feather', 'sparkle', 'dust'
                this.life = 1.0;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;

                if (type === 'sparkle') {
                    this.vy = Math.random() * -3;
                    this.size = Math.random() * 3 + 1;
                }
            }

            update() {
                this.life -= 0.02;
                this.x += this.vx;
                this.y += this.vy;

                // Gravity removed for particles
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                if (this.type === 'sparkle') {
                    ctx.fillStyle = `rgba(255, 215, 0, ${this.life})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        }

        const FX = {
            particles: [],
            shake: 0,

            add(x, y, type, count = 5) {
                // Optimization: Limit max particles
                if (this.particles.length > 50) return;
                for(let i=0; i<count; i++) {
                    this.particles.push(new Particle(x, y, type));
                }
            },

            screenShake(intensity) {
                this.shake = intensity;
                if (navigator.vibrate) navigator.vibrate(intensity * 10);
            },

            update() {
                if (this.shake > 0) this.shake *= 0.9;
                if (this.shake < 0.5) this.shake = 0;

                for(let i=this.particles.length-1; i>=0; i--) {
                    const p = this.particles[i];
                    p.update();
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            },

            draw(ctx) {
                this.particles.forEach(p => p.draw(ctx));
            }
        };

        // --- Asset Caching for Performance ---
        const AssetCache = {
            backgrounds: {},
            pipes: {},
            mountains: null,
            init(width, height) {
                // Cache Pipe
                this.cachePipe();
                // Cache Mountains
                this.cacheMountains(width, height);
            },

            cachePipe() {
                const w = 60;
                const h = 400; // Arbitrary tall height

                // Main Pipe Canvas
                const cvs = document.createElement('canvas');
                cvs.width = w;
                cvs.height = h;
                const ctx = cvs.getContext('2d');

                // 3D Gradient
                const pipeGradient = ctx.createLinearGradient(0, 0, w, 0);
                pipeGradient.addColorStop(0, '#2e7d32');
                pipeGradient.addColorStop(0.2, '#66bb6a');
                pipeGradient.addColorStop(0.5, '#4caf50');
                pipeGradient.addColorStop(1, '#1b5e20');

                ctx.fillStyle = pipeGradient;
                ctx.strokeStyle = '#1b5e20';
                ctx.lineWidth = 2;
                ctx.fillRect(0, 0, w, h);
                ctx.strokeRect(0, 0, w, h);

                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(10, 0, 10, h);

                this.pipes.body = cvs;

                // Cap Canvas
                const capCvs = document.createElement('canvas');
                capCvs.width = w + 10;
                capCvs.height = 25;
                const capCtx = capCvs.getContext('2d');

                const capGradient = capCtx.createLinearGradient(0, 0, w + 10, 0);
                capGradient.addColorStop(0, '#2e7d32');
                capGradient.addColorStop(0.2, '#81c784');
                capGradient.addColorStop(1, '#1b5e20');

                capCtx.fillStyle = capGradient;
                capCtx.fillRect(0, 0, w+10, 25);
                capCtx.strokeRect(0, 0, w+10, 25);
                capCtx.fillStyle = 'rgba(255,255,255,0.3)';
                capCtx.fillRect(15, 0, 10, 25);

                this.pipes.cap = capCvs;
            },

            cacheMountains(width, height) {
                // Wide canvas for scrolling
                const w = width * 2;
                const cvs = document.createElement('canvas');
                cvs.width = w;
                cvs.height = height;
                const ctx = cvs.getContext('2d');

                // Distant
                ctx.fillStyle = '#1565c0';
                ctx.beginPath();
                ctx.moveTo(0, height);
                for (let i = 0; i <= w; i+= 50) {
                     ctx.lineTo(i, height - 150 - Math.sin(i * 0.01) * 50);
                }
                ctx.lineTo(w, height);
                ctx.fill();

                // Hills
                ctx.fillStyle = '#2e7d32';
                ctx.beginPath();
                ctx.moveTo(0, height);
                for (let i = 0; i <= w; i+= 50) {
                     ctx.lineTo(i, height - 50 - Math.sin(i * 0.02) * 30);
                }
                ctx.lineTo(w, height);
                ctx.lineTo(0, height);
                ctx.fill();

                this.mountains = cvs;
            }
        };

        // --- Game Configuration & Data ---
        const CHARACTERS = {
            bird: { name: "Bird", price: 0, color: "#FFD700", type: "bird" },
            blue: { name: "Blue Bird", price: 100, color: "#3498db", type: "bird" },
            red: { name: "Red Bird", price: 200, color: "#e74c3c", type: "bird" },
            green: { name: "Green Bird", price: 300, color: "#2ecc71", type: "bird" },
            dragon: { name: "Dragon", price: 1000, color: "#8e44ad", type: "dragon" },
            phoenix: { name: "Phoenix", price: 2000, color: "#e67e22", type: "dragon" }
        };

        const SKILLS = {
            magnet: { baseCost: 100, maxLevel: 5 }
        };

        const User = {
            username: null,
            password: null,
            data: null,
            settings: { sound: true, vibration: true },

            login(username, password) {
                if (!username || !password) return alert("Masukkan username dan password!");

                const savedString = localStorage.getItem(`fb_game_${username}`);
                let account = null;

                if (savedString) {
                    try {
                        account = JSON.parse(savedString);
                        if (!account.password) {
                            account.password = password;
                        } else if (account.password !== password) {
                            alert("Password salah!");
                            return false;
                        }
                    } catch (e) {
                        account = null;
                    }
                }

                if (!account) {
                    account = {
                        password: password,
                        data: {
                            coins: 0,
                            highScore: 0,
                            unlocked: ['bird'],
                            selected: 'bird',
                            skills: { magnet: 0 },
                            medals: { bronze: 0, silver: 0, gold: 0, platinum: 0 },
                            missions: { totalFlaps: 0, lastLogin: Date.now() }
                        },
                        settings: { sound: true, vibration: true }
                    };
                    alert("Akun baru dibuat!");
                }

                this.username = username;
                this.password = password;
                this.data = account.data;
                this.settings = account.settings || { sound: true, vibration: true };

                // Data migration
                if (!this.data.medals) this.data.medals = { bronze: 0, silver: 0, gold: 0, platinum: 0 };
                if (!this.data.missions) this.data.missions = { totalFlaps: 0, lastLogin: Date.now() };

                this.save();
                return true;
            },

            save() {
                if (this.username && this.data) {
                    const payload = {
                        password: this.password,
                        data: this.data
                    };
                    localStorage.setItem(`fb_game_${this.username}`, JSON.stringify(payload));
                }
            },

            addCoins(amount) {
                this.data.coins += amount;
                this.save();
                UI.updateCoins();
            },

            buyCharacter(id) {
                const char = CHARACTERS[id];
                if (this.data.coins >= char.price) {
                    this.data.coins -= char.price;
                    this.data.unlocked.push(id);
                    this.selectCharacter(id);
                    this.save();
                    return true;
                }
                return false;
            },

            selectCharacter(id) {
                if (this.data.unlocked.includes(id)) {
                    this.data.selected = id;
                    this.save();
                    return true;
                }
                return false;
            },

            upgradeSkill(skillName) {
                const skill = SKILLS[skillName];
                const currentLevel = this.data.skills[skillName] || 0;

                if (currentLevel >= skill.maxLevel) return false;

                const cost = skill.baseCost * (currentLevel + 1);

                if (this.data.coins >= cost) {
                    this.data.coins -= cost;
                    this.data.skills[skillName] = currentLevel + 1;
                    this.save();
                    return true;
                }
                return false;
            }
        };

        // --- UI Manager ---
        const UI = {
            screens: ['splash-screen', 'login-screen', 'menu-screen', 'shop-screen', 'game-over-screen'],

            show(screenId) {
                this.screens.forEach(id => document.getElementById(id).classList.add('hidden'));
                const el = document.getElementById(screenId);
                if(el) el.classList.remove('hidden');

                // Haptic feedback
                if (User.settings.vibration && navigator.vibrate) navigator.vibrate(10);
                AudioController.play('click');
            },

            init() {
                // Show splash then login
                setTimeout(() => {
                    this.show('login-screen');
                }, 2000);

                // Init Audio on interaction
                document.body.addEventListener('click', () => {
                    AudioController.init();
                }, { once: true });
            },

            showMenu() {
                this.show('menu-screen');
                document.getElementById('player-name').textContent = User.username;
                document.getElementById('game-hud').style.display = 'none';
                this.updateCoins();

                // Update Settings Button text
                const soundBtn = document.getElementById('sound-btn');
                if(soundBtn) {
                    soundBtn.textContent = `SOUND: ${User.settings.sound ? 'ON' : 'OFF'}`;
                }
            },

            toggleSound() {
                User.settings.sound = !User.settings.sound;
                User.save();
                this.showMenu();
            },

            showShop() {
                this.show('shop-screen');
                this.renderShop();
            },

            updateCoins() {
                const coins = User.data.coins;
                document.getElementById('menu-coins').textContent = coins;
                document.getElementById('shop-coins').textContent = coins;
                document.getElementById('current-coins').textContent = coins;
            },

            renderShop() {
                const list = document.getElementById('character-list');
                list.innerHTML = '';

                Object.keys(CHARACTERS).forEach(key => {
                    const char = CHARACTERS[key];
                    const isUnlocked = User.data.unlocked.includes(key);
                    const isSelected = User.data.selected === key;

                    const el = document.createElement('div');
                    el.className = `shop-item ${isSelected ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
                    el.onclick = () => Shop.handleItemClick(key);

                    // Draw mini canvas for preview
                    const cvs = document.createElement('canvas');
                    cvs.width = 50; cvs.height = 50;
                    cvs.className = 'item-preview';
                    const ctx = cvs.getContext('2d');
                    // Simple preview drawing
                    ctx.translate(25, 25);
                    ctx.fillStyle = char.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI*2);
                    ctx.fill();

                    if (!isUnlocked) {
                        el.classList.add('locked-overlay');
                    }

                    // Create text elements
                    const nameEl = document.createElement('div');
                    nameEl.className = 'item-name';
                    nameEl.textContent = char.name;

                    const costEl = document.createElement('div');
                    costEl.className = 'item-cost';
                    costEl.textContent = isUnlocked ? (isSelected ? 'EQUIPPED' : 'OWNED') : `🪙 ${char.price}`;

                    // Append everything
                    el.appendChild(cvs);
                    el.appendChild(nameEl);
                    el.appendChild(costEl);

                    list.appendChild(el);
                });

                // Update Upgrade UI
                const magLvl = User.data.skills.magnet;
                document.getElementById('magnet-level').textContent = magLvl >= SKILLS.magnet.maxLevel ? "MAX" : magLvl;
                const nextCost = SKILLS.magnet.baseCost * (magLvl + 1);
                const btn = document.getElementById('magnet-cost').parentElement;
                btn.style.display = magLvl >= SKILLS.magnet.maxLevel ? "none" : "inline-block";
                document.getElementById('magnet-cost').textContent = nextCost;
            }
        };

        // --- Shop Logic ---
        const Shop = {
            handleItemClick(id) {
                if (User.data.unlocked.includes(id)) {
                    User.selectCharacter(id);
                } else {
                    if (confirm(`Buy ${CHARACTERS[id].name} for ${CHARACTERS[id].price} coins?`)) {
                        if (!User.buyCharacter(id)) {
                            alert("Not enough coins!");
                        }
                    }
                }
                UI.renderShop();
            },

            upgradeSkill(skill) {
                if (!User.upgradeSkill(skill)) {
                    alert("Not enough coins or Max Level!");
                }
                UI.renderShop();
                UI.updateCoins();
            }
        };

        // --- Game Engine ---
        const Canvas = document.getElementById('gameCanvas');
        const Ctx = Canvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const dpr = window.devicePixelRatio || 1;
            const width = container.clientWidth;
            const height = container.clientHeight;

            Canvas.style.width = width + "px";
            Canvas.style.height = height + "px";

            Canvas.width = width * dpr;
            Canvas.height = height * dpr;

            Ctx.scale(dpr, dpr);

            // Re-init cache on resize
            AssetCache.init(width * dpr, height * dpr);

            return { width, height };
        }

        const Game = {
            state: 'start', // start, playing, gameover
            width: 0,
            height: 0,
            frame: 0,
            score: 0,
            coinsCollected: 0,
            entities: [],

            // Game Loop
            loopId: null,

            login() {
                const username = document.getElementById('username-input').value.trim();
                const password = document.getElementById('password-input').value.trim();
                if (User.login(username, password)) {
                    UI.showMenu();
                }
            },

            logout() {
                User.username = null;
                User.data = null;
                UI.show('login-screen');
                document.getElementById('username-input').value = '';
                document.getElementById('password-input').value = '';
            },

            start() {
                UI.show('none'); // Hide all menus
                document.getElementById('game-hud').style.display = 'flex';
                this.resize();
                this.reset();
                this.state = 'playing';
                this.loop();
            },

            restart() {
                this.start();
            },

            resize() {
                const dim = resizeCanvas();
                this.width = dim.width;
                this.height = dim.height;
            },

            reset() {
                this.score = 0;
                this.coinsCollected = 0;
                this.frame = 0;
                FX.particles = [];
                FX.shake = 0;

                document.getElementById('current-score').textContent = 0;
                document.getElementById('current-coins').textContent = User.data.coins;

                // Initialize Entities
                this.player = new Player(this.width / 3, this.height / 2);
                this.pipes = [];
                this.coins = [];
                this.bgOffset = 0;
            },

            loop() {
                if (this.state !== 'playing') return;

                this.update();
                this.draw();

                this.loopId = requestAnimationFrame(() => this.loop());
            },

            stop() {
                cancelAnimationFrame(this.loopId);
            },

            gameOver() {
                this.state = 'gameover';
                FX.screenShake(10);
                AudioController.play('crash');

                // Save score
                if (this.score > User.data.highScore) {
                    User.data.highScore = this.score;
                }
                User.addCoins(this.coinsCollected); // Coins are permanently added

                // Check Medals
                let medal = null;
                if (this.score >= 100) { medal = 'platinum'; User.data.medals.platinum++; }
                else if (this.score >= 50) { medal = 'gold'; User.data.medals.gold++; }
                else if (this.score >= 25) { medal = 'silver'; User.data.medals.silver++; }
                else if (this.score >= 10) { medal = 'bronze'; User.data.medals.bronze++; }

                if (medal) User.save();

                // Update UI
                document.getElementById('final-score').textContent = this.score;
                document.getElementById('best-score').textContent = User.data.highScore;
                document.getElementById('collected-coins').textContent = this.coinsCollected;

                // Show Medal
                const medalEl = document.getElementById('medal-display');
                if (medal) {
                    medalEl.innerHTML = `<div class="medal ${medal}"></div><span>${medal.toUpperCase()}</span>`;
                    medalEl.classList.remove('hidden');
                } else {
                    medalEl.classList.add('hidden');
                }

                setTimeout(() => {
                    UI.show('game-over-screen');
                }, 500);
            },

            update() {
                this.frame++;
                FX.update();
                this.player.update();

                // Spawn Pipes
                if (this.frame % 120 === 0) {
                    this.pipes.push(new Pipe(this.width));

                    // 50% chance to spawn coin in pipe
                    if (Math.random() > 0.3) {
                         const pipe = this.pipes[this.pipes.length-1];
                         this.coins.push(new Coin(pipe.x + pipe.w/2, pipe.gapY + pipe.gap/2));
                    }
                }

                // Update Pipes
                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    const pipe = this.pipes[i];
                    pipe.update();

                    if (pipe.offScreen()) {
                        this.pipes.splice(i, 1);
                    }

                    // Collision
                    if (pipe.collides(this.player)) {
                        this.gameOver();
                    }

                    // Score
                    if (!pipe.passed && pipe.x + pipe.w < this.player.x) {
                        pipe.passed = true;
                        this.score++;
                        document.getElementById('current-score').textContent = this.score;
                        FX.add(this.player.x, this.player.y, 'sparkle', 2);
                    }
                }

                // Update Coins
                const magnetRadius = User.data.skills.magnet * 50; // 50px per level

                for (let i = this.coins.length - 1; i >= 0; i--) {
                    const coin = this.coins[i];
                    coin.update();

                    // Magnet Effect
                    if (magnetRadius > 0) {
                        const dx = this.player.x - coin.x;
                        const dy = this.player.y - coin.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < magnetRadius + 100) {
                            coin.x += dx * 0.1;
                            coin.y += dy * 0.1;
                        }
                    }

                    // Collision
                    if (coin.collides(this.player)) {
                        this.coinsCollected++;
                        FX.add(coin.x, coin.y, 'sparkle', 10);
                        if (navigator.vibrate) navigator.vibrate(5);

                        document.getElementById('current-coins').textContent = User.data.coins + this.coinsCollected;
                        this.coins.splice(i, 1);
                    } else if (coin.offScreen()) {
                        this.coins.splice(i, 1);
                    }
                }

                // Floor Collision
                if (this.player.y + this.player.radius >= this.height) {
                    this.gameOver();
                }
            },

            draw() {
                Ctx.save();
                // Screen shake
                const shakeX = (Math.random() - 0.5) * FX.shake;
                const shakeY = (Math.random() - 0.5) * FX.shake;
                Ctx.translate(shakeX, shakeY);

                // Realistic Background
                // Sky (Draw every frame is fine, gradients are fast)
                const bgGradient = Ctx.createLinearGradient(0, 0, 0, this.height);
                bgGradient.addColorStop(0, '#1a73e8');
                bgGradient.addColorStop(1, '#64b5f6');
                Ctx.fillStyle = bgGradient;
                Ctx.fillRect(0, 0, this.width, this.height);

                // Sun (Simple)
                Ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                Ctx.beginPath();
                Ctx.arc(this.width * 0.8, 80, 40, 0, Math.PI*2);
                Ctx.fill();

                // Mountains (Cached)
                if (AssetCache.mountains) {
                    const offset = (this.frame * 0.2) % (this.width);
                    // Draw twice for seamless scroll
                    // Source: cached image
                    // Destination: Scrolling logic
                    const mWidth = AssetCache.mountains.width;
                    const mHeight = AssetCache.mountains.height;

                    // Simple infinite scroll calculation
                    const scrollX = (this.frame * 0.5) % this.width;

                    Ctx.drawImage(AssetCache.mountains, -scrollX, 0, mWidth, mHeight);
                    Ctx.drawImage(AssetCache.mountains, -scrollX + mWidth/2, 0, mWidth, mHeight);
                }

                this.pipes.forEach(p => p.draw());
                this.coins.forEach(c => c.draw());
                this.player.draw();
                FX.draw(Ctx);

                Ctx.restore();
            }
        };

        // --- Entities ---
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.velocity = 0;
                this.gravity = 0.22;
                this.jump = -4.5;
                this.radius = 12;

                // Load Character Stats
                const charType = CHARACTERS[User.data.selected].type;
                if (charType === 'dragon') {
                    this.gravity = 0.18; // lighter
                    this.radius = 15;
                }
            }

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;
            }

            draw() {
                Ctx.save();
                Ctx.translate(this.x, this.y);
                const rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                Ctx.rotate(rot);

                const charData = CHARACTERS[User.data.selected];

                // Main Body
                Ctx.fillStyle = charData.color;
                Ctx.beginPath();
                Ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                Ctx.fill();

                // Glossy Highlight
                Ctx.fillStyle = 'rgba(255,255,255,0.3)';
                Ctx.beginPath();
                Ctx.ellipse(-5, -5, this.radius/2, this.radius/3, Math.PI/4, 0, Math.PI*2);
                Ctx.fill();

                // Eye (With depth)
                Ctx.fillStyle = 'white';
                Ctx.beginPath();
                Ctx.arc(6, -6, 6, 0, Math.PI * 2);
                Ctx.fill();

                Ctx.fillStyle = '#333'; // Pupil
                Ctx.beginPath();
                Ctx.arc(8, -6, 2.5, 0, Math.PI * 2);
                Ctx.fill();

                // Wing
                Ctx.fillStyle = 'rgba(0,0,0,0.15)';
                Ctx.beginPath();
                Ctx.ellipse(-6, 4, 10, 6, -0.2, 0, Math.PI*2);
                Ctx.fill();

                Ctx.restore();
            }

            flap() {
                this.velocity = this.jump;
                AudioController.play('flap');
                // Feather effect removed for performance
            }
        }

        class Pipe {
            constructor(canvasWidth) {
                this.x = canvasWidth;
                this.w = 60;
                this.gap = 190;
                this.speed = 3;
                this.passed = false;

                // Random position centered around middle of screen
                const minH = Game.height * 0.2; // 20% from top
                const maxH = Game.height * 0.8 - this.gap; // 20% from bottom
                this.gapY = Math.floor(Math.random() * (maxH - minH + 1) + minH);
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                if (AssetCache.pipes.body) {
                    // Top Pipe
                    Ctx.drawImage(AssetCache.pipes.body, 0, 0, this.w, this.gapY, this.x, 0, this.w, this.gapY);
                    // Top Cap
                    Ctx.drawImage(AssetCache.pipes.cap, this.x - 5, this.gapY - 25);

                    // Bottom Pipe
                    const bottomY = this.gapY + this.gap;
                    const bottomH = Game.height - bottomY;
                    Ctx.drawImage(AssetCache.pipes.body, 0, 0, this.w, bottomH, this.x, bottomY, this.w, bottomH);
                    // Bottom Cap
                    Ctx.drawImage(AssetCache.pipes.cap, this.x - 5, bottomY);
                } else {
                    // Fallback
                    Ctx.fillStyle = '#2e7d32';
                    Ctx.fillRect(this.x, 0, this.w, this.gapY);
                }
            }

            offScreen() {
                return this.x + this.w < 0;
            }

            collides(player) {
                // Simple box collision
                // Top box
                if (player.x + player.radius > this.x && player.x - player.radius < this.x + this.w) {
                    if (player.y - player.radius < this.gapY || player.y + player.radius > this.gapY + this.gap) {
                        return true;
                    }
                }
                return false;
            }
        }

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.wobble = Math.random() * Math.PI * 2;
            }

            update() {
                this.x -= 3; // Move with pipes
                this.wobble += 0.1;
                this.y += Math.sin(this.wobble) * 0.5;
            }

            draw() {
                Ctx.save();
                Ctx.translate(this.x, this.y);

                // 3D Spin Effect
                const scaleX = Math.abs(Math.sin(this.wobble));
                Ctx.scale(scaleX, 1);

                // Gold Gradient
                const grad = Ctx.createRadialGradient(-2, -2, 1, 0, 0, this.radius);
                grad.addColorStop(0, '#fff'); // Shine
                grad.addColorStop(0.3, '#FFD700'); // Gold
                grad.addColorStop(1, '#B8860B'); // Dark Gold

                Ctx.fillStyle = grad;
                Ctx.beginPath();
                Ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                Ctx.fill();

                // Outer Ring
                Ctx.strokeStyle = '#DAA520';
                Ctx.lineWidth = 2;
                Ctx.stroke();

                Ctx.restore();
            }

            offScreen() {
                return this.x + 20 < 0;
            }

            collides(player) {
                const dx = this.x - player.x;
                const dy = this.y - player.y;
                return Math.sqrt(dx*dx + dy*dy) < (this.radius + player.radius);
            }
        }

        // --- Controls ---
        window.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                if (Game.state === 'playing') Game.player.flap();
            }
        });

        window.addEventListener('mousedown', () => {
             if (Game.state === 'playing') Game.player.flap();
        });

        window.addEventListener('touchstart', (e) => {
             //e.preventDefault(); // handled by css touch-action
             if (Game.state === 'playing') Game.player.flap();
        });

        window.addEventListener('resize', () => {
            Game.resize();
        });

        // Init
        window.onload = () => {
            Game.resize();
            UI.init();
        };

    </script>
</body>
</html>
